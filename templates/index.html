<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL League Standings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #5a5a5a;
        }

        table {
            border-radius: 10px;
            overflow: hidden;
        }

        thead th {
            background-color: #007bff;
            color: white;
            border: none;
        }

        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        .team-link {
            color: inherit;
            text-decoration: none;
            font-weight: 500;
            display: contents;
        }

        .club-badge {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 6px;
        }

        .club-badge-placeholder {
            width: 40px;
            height: 40px;
            background-color: #e9ecef;
            border-radius: 6px;
            display: inline-block;
        }

        .badge-column {
            text-align: center;
            width: 70px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mb-4">
            <a href="/fixtures" class="btn btn-primary">View Fixtures</a>
            <a href="/standings" class="btn btn-primary">Premier League Standings</a>
        </div>

        <h1>{{ league_name }}</h1>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th class="badge-column">Logo</th>
                        <th>Team Name</th>
                        <th>GW</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    {% for entry in standings %}
                    <tr onclick="window.location='/team/{{ entry.entry }}'">
                        <td>{{ entry.rank }}</td>
                        <td class="badge-column">
                            {% if entry.club_badge_src %}
                            <img src="{{ entry.club_badge_src }}"
                                 alt="Club Badge"
                                 class="club-badge">
                            {% else %}
                            <div class="club-badge-placeholder"></div>
                            {% endif %}
                        </td>
                        <td>{{ entry.entry_name }}</td>
                        <td>{{ entry.event_total }}</td>
                        <td>{{ entry.total }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
